name: typing

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]


jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install launcheon package
      uses: ./.github/actions/launcheon_build
    - name: Static type analysis with pyright 
      run: | 
        uv run --frozen --group dev -m pyright launcheon