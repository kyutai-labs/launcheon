name: launcheon_build
description: 'Build minimum env for static analysis.'
runs:
  using: 'composite'
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@v5

    - name: Install ruff
      uses: astral-sh/ruff-action@v3
      with:
        args: "--version" 
        version: "0.11.2" 

    # Install without the optional dependency groups
    - run: uv sync --frozen --no-default-groups
      shell: bash